name: sentinelforge-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelforge_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinelforge}:${POSTGRES_PASSWORD:-sentinelforge_dev}@postgres:5432/${POSTGRES_DB:-sentinelforge}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./detection-rules:/app/detection-rules:ro
      - ./knowledge-base:/app/knowledge-base:ro
      - ./simulator:/app/simulator:ro
      - ./scenarios:/app/scenarios:ro
      - ./ml:/app/ml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinelforge}:${POSTGRES_PASSWORD:-sentinelforge_dev}@postgres:5432/${POSTGRES_DB:-sentinelforge}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./detection-rules:/app/detection-rules:ro
      - ./knowledge-base:/app/knowledge-base:ro
      - ./simulator:/app/simulator:ro
      - ./scenarios:/app/scenarios:ro
      - ./ml:/app/ml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.main

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
